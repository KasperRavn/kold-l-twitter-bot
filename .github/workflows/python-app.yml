name: twitter bot

on:
  schedule:
    - cron: "5 11 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: install packages
        run: pip install -r requirements.txt

      - name: create .env file
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: run bot
        run: python main.py